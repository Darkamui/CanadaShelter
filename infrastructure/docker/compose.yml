# Local development infrastructure (architecture §28). Not for any shared or production use.
# Every value has a dev default, so this works without a .env file. See /.env.example.
name: shelter

services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev}
      SHELTER_DB: ${SHELTER_DB:-shelter}
      SHELTER_MIGRATOR_PASSWORD: ${SHELTER_MIGRATOR_PASSWORD:-shelter_migrator_dev}
      SHELTER_APP_PASSWORD: ${SHELTER_APP_PASSWORD:-shelter_app_dev}
      SHELTER_PLATFORM_ADMIN_PASSWORD: ${SHELTER_PLATFORM_ADMIN_PASSWORD:-shelter_platform_admin_dev}
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${SHELTER_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  # Official MinIO images are no longer publicly pullable; Chainguard builds MinIO from source.
  # Only :latest is free, so the image is pinned by digest. Bump deliberately.
  minio:
    image: cgr.dev/chainguard/minio@sha256:9dcc028b309030afa86fc1fc8d93907ae373ea3fb75277cca3fc77e4645932b7
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shelter}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shelter_minio_dev}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data

  # One-shot: creates the private local bucket. Retries until MinIO accepts connections.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    depends_on: [minio]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-shelter}:${MINIO_ROOT_PASSWORD:-shelter_minio_dev}@minio:9000
    command: ['mb', '--ignore-existing', 'local/${MINIO_BUCKET:-shelter-local}']
    restart: on-failure:10

  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
  minio-data:
