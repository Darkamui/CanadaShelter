name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

# Job names are the required status checks for main (docs/contributing.md). Rename both together.
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - run: dotnet build backend
      - run: dotnet format backend --verify-no-changes --no-restore
      # Integration tests start PostgreSQL through Testcontainers (Docker is on the runner).
      - run: dotnet test backend --no-build

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - run: pnpm --filter @shelter/admin exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  api-sync:
    name: api-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-js
      - run: pnpm api:generate
      - name: Generated API client is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff --stat
            echo "::error::openapi.json or packages/api-client/src/generated is stale. Run 'pnpm api:generate' and commit the result."
            exit 1
          fi

  # Hard rule 10: a migration that exists on the base branch is never edited, renamed or deleted.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Applied migrations are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Migration files only: the model snapshot changes with every new migration, and helpers are not migrations.
          changed=$(git diff --name-status --no-renames "origin/${BASE_REF}...HEAD" -- 'backend/Shelter.Migrations/Migrations/' ':!**/*ModelSnapshot.cs' | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Existing migrations were modified or deleted. Add a new migration instead (CLAUDE.md hard rule 10)."
            exit 1
          fi
      - uses: ./.github/actions/setup-dotnet
      # The composed model (ADR 0005) must match the latest migration snapshot: no model change without a migration.
      - name: No pending model changes
        run: |
          dotnet tool restore
          dotnet restore backend
          dotnet tool run dotnet-ef migrations has-pending-model-changes             --project backend/Shelter.Migrations --startup-project backend/Shelter.Host

  # Flags vulnerable or disallowed-licence packages introduced by a PR (supports hard rule 9 review).
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate

  # Lints workflow syntax (actionlint) and workflow security (zizmor, medium severity and up).
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -no-color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          min-severity: medium
          advanced-security: false
